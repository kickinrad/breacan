# Tokyo Mono Night — tmux theme
# Source this file from your tmux.conf:
#   source-file ~/.config/tmux/tokyo-mono.conf
#
# Colors: https://github.com/kickinrad/tokyo-mono
#
# Layer mapping:
#   crust   {{night.crust}}  — popup bg, thumbs bg
#   base    {{night.base}}  — status bar bg (matches terminal background)
#   mantle  {{night.mantle}}  — messages, mode bg
#   surface0 {{night.surface0}} — copy match highlight bg
#   surface1 {{night.surface1}} — borders, separators, dividers
#   subtext0 {{night.subtext0}}  — metadata and inactive windows
#   overlay  {{night.overlay}}  — decorative dividers only
#   blue    {{night.blue}}  — active border, session name, clock, focus
#   cyan    {{night.cyan}}  — time
#   red     {{night.red}}  — zoom flag

# Pane borders
set -g pane-border-style fg='{{night.surface1}}'
set -g pane-active-border-style fg='{{night.blue}}'

# Status bar
set -g status-style bg='{{night.base}}',fg='{{night.text}}'
set -g status-position bottom
set -g status-justify left
set -g status-interval 15
set -g status-left-length 60
set -g status-right-length 32

# Agent Deck exposes @agentdeck_project_name. Other sessions fall back to
# session name + current directory, so this remains useful without Agent Deck.
set -g status-left '#[fg={{night.blue}},bold] #{?@agentdeck_project_name,#{pane_current_command},#S} #[fg={{night.overlay}}]· #[fg={{night.subtext1}}]#{?@agentdeck_project_name,#{@agentdeck_project_name},#{b:pane_current_path}} #[fg={{night.surface1}}]│ '
set -g status-right '#{?#{e|>=:#{client_width},120},#[fg={{night.subtext0}}]%a %b %d #[fg={{night.surface1}}]│ ,}#[fg={{night.cyan}}]%H:%M '

# Window status
set -g window-status-format '#{?@agentdeck_project_name,,#[fg={{night.subtext0}}] #I:#W }'
set -g window-status-current-format '#{?@agentdeck_project_name,,#[fg={{night.blue}},bold] #I:#W#{?window_zoomed_flag, #[fg={{night.red}}]Z,} }'
set -g window-status-separator ''

# Message style
set -g message-style bg='{{night.mantle}}',fg='{{night.text}}'

# Copy mode
set -g mode-style bg='{{night.mantle}}',fg='{{night.text}}'
set -g copy-mode-match-style bg='{{night.surface0}}',fg='{{night.text}}'
set -g copy-mode-current-match-style bg='{{night.surface1}}',fg='{{night.blue}}',bold

# Pane number display (prefix + q)
set -g display-panes-colour '{{night.surface1}}'
set -g display-panes-active-colour '{{night.blue}}'

# Clock (prefix + t)
set -g clock-mode-colour '{{night.blue}}'

# Popup
set -g popup-border-style fg='{{night.surface1}}'
set -g popup-style bg='{{night.mantle}}'
