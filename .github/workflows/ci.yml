name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - run: mise run setup
      - run: mise run check
      - run: mise run reuse
      - run: mise run license
      # The playground's client is linted as a consumer would be.
      - run: bun bin/breacan.mjs lint src/web/playground.js src/web/foundations.js src/web/components.js src/web/cards.js src/web/pages.js src/web/examples.js src/web/tailwind.html
      - name: Material baseline matches androidx
        run: bun scripts/vendor-m3.mjs --check
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise run build
      - run: bun test
        env:
          BREACAN_BIN: dist/breacan
  # The core is the npm package projects install, so it is proven on a second OS: installed from a lockfile, tested,
  # then packed and run through bunx the way a consumer gets it.
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - run: bun install --frozen-lockfile
      - run: bun test
        working-directory: packages/core
      - run: mise run pack-smoke
