[tools]
bun = "latest"

[tasks.setup]
run = "bun install"

[tasks.check]
run = "bun build bin/breacan.mjs --target=bun --outdir=dist/check >/dev/null"

[tasks.test]
run = "bun test"

[tasks.build]
# The release asset holds the one binary, so `mise use github:kickinrad/breacan` puts `breacan` on the PATH.
run = [
  "bun build --compile --target=bun-linux-x64 --asset src/color.mjs --asset src/web --asset node_modules/beercss/dist/cdn bin/breacan.mjs --outfile dist/breacan",
  "tar -czf dist/breacan-linux-x64.tar.gz -C dist breacan",
]
