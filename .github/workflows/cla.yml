name: cla
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions:
  contents: read
jobs:
  cla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Bots (dependency and release pull requests) and the repository owner are exempt (CONTRIBUTING.md).
    if: ${{ github.event.pull_request.user.login != 'kickinrad' && !endsWith(github.event.pull_request.user.login, '[bot]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Author has signed and ticked the box
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          grep -Eiq -- '^[[:space:]]*- \[x\] I have read `CLA\.md`' <<< "$BODY" \
            || { echo "::error::Tick the CLA box in the pull request description (CONTRIBUTING.md)."; exit 1; }
          grep -Eiq -- "^${AUTHOR//[^A-Za-z0-9-]/} [0-9]{4}-[0-9]{2}-[0-9]{2}\$" .github/cla-signatures.txt \
            || { echo "::error::Add '${AUTHOR} YYYY-MM-DD' to .github/cla-signatures.txt (CONTRIBUTING.md)."; exit 1; }
