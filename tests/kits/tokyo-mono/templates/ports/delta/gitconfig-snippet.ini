[delta]
    navigate = true
    line-numbers = true
    side-by-side = false
    syntax-theme = tokyo-mono
    plus-style = "syntax #1e2a1e"
    plus-emph-style = "syntax #203820"
    minus-style = "syntax #2a1e1e"
    minus-emph-style = "syntax #3d2020"
    hunk-header-style = "syntax bold"
    hunk-header-decoration-style = "{{night.surface1}} box"
    line-numbers-minus-style = "{{night.red}}"
    line-numbers-plus-style = "{{night.green}}"
    line-numbers-zero-style = "{{night.overlay}}"
