# Tokyo Mono: Tokyo Night accents on the Windows 11 Fluent 2 greys. The plain theme: every terminal, editor and app
# theme in ports/ is built from this file by Breacán (`tokens`). Tokyo Material, the Material 3 kit, builds on it.
name = "tokyo-mono"
title = "Tokyo Mono"
default = "night"

[media]
day = "(prefers-color-scheme: light)"

[palette.night]  # Windows 11 dark mode native. Backgrounds match Fluent 2 grey scale exactly.
crust = "#141414"
mantle = "#1f1f1f"
base = "#292929"
surface0 = "#333333"
surface1 = "#3d3d3d"
text = "#ffffff"
subtext1 = "#d6d6d6"
subtext0 = "#adadad"
overlay = "#666666"
blue = "#7aa2f7"
cyan = "#7dcfff"
purple = "#bb9af7"
green = "#9ece6a"
red = "#f79178"
orange = "#ff9e64"
yellow = "#e0af68"
teal = "#73daca"

[palette.day]  # Windows 11 light mode native. Backgrounds match Fluent 2 light scale exactly.
crust = "#ebebeb"
mantle = "#f5f5f5"
base = "#ffffff"
surface0 = "#fafafa"
surface1 = "#d1d1d1"
text = "#242424"
subtext1 = "#424242"
subtext0 = "#616161"
overlay = "#e0e0e0"
blue = "#2e7de9"
cyan = "#007197"
purple = "#9854f1"
green = "#587539"
red = "#f54729"
orange = "#cf7b20"
yellow = "#8c6c3e"
teal = "#118c74"

# What Obsidian and Mealie read: the page and panel greys, the text tiers and the accents, by palette name.
[roles]
"tokyo-mono.color.surface" = "crust"
"tokyo-mono.color.surface-container-low" = "mantle"
"tokyo-mono.color.surface-container" = "base"
"tokyo-mono.color.surface-container-high" = "surface0"
"tokyo-mono.color.surface-container-highest" = "surface1"
"tokyo-mono.color.on-surface" = "text"
"tokyo-mono.color.on-surface-variant" = "subtext1"
"tokyo-mono.color.on-surface-muted" = "subtext0"  # Hints, metadata, disabled labels
"tokyo-mono.color.comment" = "overlay"  # Code comments and placeholders only; fails AA for body text
"tokyo-mono.color.primary" = "blue"
"tokyo-mono.color.secondary" = "teal"
"tokyo-mono.color.tertiary" = "purple"
"tokyo-mono.color.error" = "red"
"tokyo-mono.color.yellow" = "yellow"
"tokyo-mono.color.orange" = "orange"
"tokyo-mono.color.cyan" = "cyan"
"tokyo-mono.color.green" = "green"

[faces]
brand = ["Google Sans Flex", "Roboto", "sans-serif"]  # Display, headlines and titles: the same face as plain (Google Sans Flex, OFL).
plain = ["Google Sans Flex", "Roboto", "sans-serif"]  # Body copy (Google Sans Flex, OFL)
mono = ["Cascadia Code", "Cascadia Mono", "monospace"]  # Code and numbers (Cascadia Code, OFL); numerals tabular

# Mealie's seven colour slots, by palette colour: the env file's fills, and the overlay's (served by a proxy), which
# takes blue where the env file cannot.
[mealie]
slots = { primary = "cyan", accent = "teal", secondary = "yellow", success = "green", info = "teal", warning = "orange", error = "red" }
overlay = { primary = "blue", accent = "blue", secondary = "blue", success = "green", info = "teal", warning = "orange", error = "red" }
stars = "yellow"
