# Tokyo Mono Day — tmux theme
# Source this file from your tmux.conf:
#   source-file ~/.config/tmux/tokyo-mono-day.conf
#
# Colors: https://github.com/kickinrad/tokyo-mono

# Pane borders
set -g pane-border-style fg='{{day.surface1}}'
set -g pane-active-border-style fg='{{day.blue}}'

# Status bar
set -g status-style bg='{{day.base}}',fg='{{day.text}}'
set -g status-position bottom
set -g status-justify left
set -g status-interval 15
set -g status-left-length 60
set -g status-right-length 32

# Agent Deck exposes @agentdeck_project_name. Other sessions fall back to
# session name + current directory, so this remains useful without Agent Deck.
set -g status-left '#[fg={{day.blue}},bold] #{?@agentdeck_project_name,#{pane_current_command},#S} #[fg={{day.subtext0}}]· #[fg={{day.subtext1}}]#{?@agentdeck_project_name,#{@agentdeck_project_name},#{b:pane_current_path}} #[fg={{day.surface1}}]│ '
set -g status-right '#{?#{e|>=:#{client_width},120},#[fg={{day.subtext0}}]%a %b %d #[fg={{day.surface1}}]│ ,}#[fg={{day.cyan}}]%H:%M '

# Window status
set -g window-status-format '#{?@agentdeck_project_name,,#[fg={{day.subtext0}}] #I:#W }'
set -g window-status-current-format '#{?@agentdeck_project_name,,#[fg={{day.blue}},bold] #I:#W#{?window_zoomed_flag, #[fg={{day.red}}]Z,} }'
set -g window-status-separator ''

# Message and copy mode
set -g message-style bg='{{day.mantle}}',fg='{{day.text}}'
set -g mode-style bg='{{day.mantle}}',fg='{{day.text}}'
set -g copy-mode-match-style bg='{{day.surface0}}',fg='{{day.text}}'
set -g copy-mode-current-match-style bg='{{day.surface1}}',fg='{{day.blue}}',bold

# Pane number display (prefix + q)
set -g display-panes-colour '{{day.subtext0}}'
set -g display-panes-active-colour '{{day.blue}}'

# Clock (prefix + t)
set -g clock-mode-colour '{{day.blue}}'

# Popup
set -g popup-border-style fg='{{day.surface1}}'
set -g popup-style bg='{{day.mantle}}'
