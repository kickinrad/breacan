[tools]
bun = "latest"
uv = "latest"

[tasks.setup]
run = "bun install --frozen-lockfile"

[tasks.check]
run = "bun build bin/breacan.mjs --target=bun --external \"chromium-bidi/*\" --outdir=dist/check >/dev/null"

[tasks.test]
run = "bun test"

[tasks.build]
# playwright-core (the site source's browser driver) requires chromium-bidi, which only its BiDi channels reach.
# The release asset holds the one binary, so `mise use github:kickinrad/breacan` puts `breacan` on the PATH.
run = [
  "bun build --compile --target=bun-linux-x64 --external \"chromium-bidi/*\" --asset src/color.mjs --asset src/web --asset node_modules/beercss/dist/cdn bin/breacan.mjs --outfile dist/breacan",
  "tar -czf dist/breacan-linux-x64.tar.gz -C dist breacan",
]

[tasks.pack-smoke]
# The core as a consumer gets it: packed, installed in an empty folder, run through bunx.
run = "scripts/pack-smoke.sh"

[tasks.reuse]
run = "uvx reuse lint"

[tasks.license]
# Fails when a production dependency, transitive ones included, is copyleft or has no readable license.
run = "bun scripts/license-audit.mjs"
